<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicCraft - AI Comic Creator</title>
  <<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="navbar">
    <h2>🎨 ComicCraft</h2>
    <span>AI Comic Story Creator</span>
  </header>

  <main class="container">
    <section class="hero">
      <p class="tag">YOUR IMAGINATION, YOUR COMIC</p>
      <h1>Turn your ideas into <span>comics.</span></h1>
      <p>Write a story idea. Create a comic adventure.</p>
    </section>

    <section class="creator">
      <label for="story">Your story idea</label>
      <textarea id="story"
        placeholder="Example: A young boy discovers a magical power..."></textarea>

      <div class="options">
        <div>
          <label for="genre">Story genre</label>
          <select id="genre">
            <option>Fantasy</option>
            <option>Adventure</option>
            <option>Superhero</option>
            <option>Comedy</option>
            <option>Science Fiction</option>
          </select>
        </div>
        <div>
          <label for="panels">Comic panels</label>
          <select id="panels">
            <option value="4">4 panels</option>
            <option value="6">6 panels</option>
            <option value="8">8 panels</option>
          </select>
        </div>
      </div>

      <button id="generate">✨ Generate My Comic</button>
      <p id="status" role="status"></p>
    </section>

    <section class="results">
      <h2>Your comic preview</h2>
      <div id="comic" class="comic-grid">
        <p class="empty">Your generated story will appear here.</p>
      </div>
      <button id="download" class="secondary" hidden>
        Download Story as Text
      </button>
    </section>
  </main>

  <footer>Made with ❤️ by ComicCraft</footer>
  <script src="/static/script.js"></script>
</body>
</html>
